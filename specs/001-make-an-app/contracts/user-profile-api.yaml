openapi: 3.0.3
info:
  title: User Profile API
  description: Local API for managing user profiles and preferences
  version: 1.0.0

paths:
  /users:
    get:
      summary: List all user profiles
      responses:
        '200':
          description: List of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'

    post:
      summary: Create new user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    get:
      summary: Get user profile by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete user profile (soft delete)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User profile deleted
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/preferences:
    get:
      summary: Get user's preference profiles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's preference profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceProfile'

    post:
      summary: Create new preference profile for user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreferenceProfileRequest'
      responses:
        '201':
          description: Preference profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceProfile'

components:
  schemas:
    UserProfile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        isActive:
          type: boolean
        location:
          $ref: '#/components/schemas/Location'
      required:
        - userId
        - name
        - createdAt
        - lastUsed
        - isActive

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
      required:
        - name

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        location:
          $ref: '#/components/schemas/Location'

    PreferenceProfile:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 30
        isDefault:
          type: boolean
        dietaryRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/DietaryRestriction'
        cuisinePreferences:
          type: array
          items:
            $ref: '#/components/schemas/CuisinePreference'
        createdAt:
          type: string
          format: date-time
      required:
        - profileId
        - userId
        - name
        - isDefault
        - dietaryRestrictions
        - cuisinePreferences
        - createdAt

    CreatePreferenceProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 30
        isDefault:
          type: boolean
          default: false
        dietaryRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/DietaryRestrictionInput'
        cuisinePreferences:
          type: array
          items:
            $ref: '#/components/schemas/CuisinePreferenceInput'
      required:
        - name
        - dietaryRestrictions
        - cuisinePreferences

    DietaryRestriction:
      type: object
      properties:
        restrictionId:
          type: string
          format: uuid
        type:
          type: string
          enum: [vegetarian, vegan, gluten_free, dairy_free, nut_allergy, shellfish_allergy, kosher, halal, custom]
        customName:
          type: string
          maxLength: 30
      required:
        - restrictionId
        - type

    DietaryRestrictionInput:
      type: object
      properties:
        type:
          type: string
          enum: [vegetarian, vegan, gluten_free, dairy_free, nut_allergy, shellfish_allergy, kosher, halal, custom]
        customName:
          type: string
          maxLength: 30
      required:
        - type

    CuisinePreference:
      type: object
      properties:
        preferenceId:
          type: string
          format: uuid
        cuisineType:
          type: string
          enum: [italian, mexican, chinese, japanese, thai, indian, french, american, mediterranean, middle_eastern, korean, vietnamese, greek, spanish, german, british, african, caribbean]
        preferenceLevel:
          type: integer
          minimum: 1
          maximum: 5
      required:
        - preferenceId
        - cuisineType
        - preferenceLevel

    CuisinePreferenceInput:
      type: object
      properties:
        cuisineType:
          type: string
          enum: [italian, mexican, chinese, japanese, thai, indian, french, american, mediterranean, middle_eastern, korean, vietnamese, greek, spanish, german, british, african, caribbean]
        preferenceLevel:
          type: integer
          minimum: 1
          maximum: 5
      required:
        - cuisineType
        - preferenceLevel

    Location:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        updatedAt:
          type: string
          format: date-time
      required:
        - latitude
        - longitude
        - updatedAt

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
      required:
        - error
        - message
        - code